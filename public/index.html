<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/energy-logo.ico" type="image/x-icon">
    <title>Energy Store - Bebidas Energéticas coleccionables</title>
    <link rel="stylesheet" href="style.css">
    <meta name="description"
        content="Bienvenido a Energy Store, tu tienda especializada en bebidas energéticas, café y mucho más." />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Javier Garin" />

    <!-- Open Graph / LinkedIn / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://web-carousel-ivory.vercel.app/" />
    <meta property="og:title" content="Energy Store - bebidas energéticas, café y mucho más" />
    <meta property="og:description"
        content="Explora nuestra exclusiva selección de bebidas energéticas internacionales." />
    <!-- IMPORTANTE: LinkedIn requiere URL absoluta para la imagen -->
    <meta property="og:image" content="https://web-carousel-ivory.vercel.app/screenshot-energy-store.png" />
    <meta property="og:image:secure_url" content="https://web-carousel-ivory.vercel.app/screenshot-energy-store.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Logotipo de Energy Store con productos coleccionables" />
    <!-- Dimensiones recomendadas para LinkedIn -->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://web-carousel-ivory.vercel.app" />
    <meta property="twitter:title" content="Energy Store" />
    <meta property="twitter:description" content="Tu tienda especializada en bebidas, café y mucho más." />
    <meta property="twitter:image" content="https://web-carousel-ivory.vercel.app/screenshot-energy-store.png" />
</head>

<body>

    <header>
        <figure class="logo">
            <img src="images/energy-logo.svg" alt="Energy Store Logo">
        </figure>
        <button class="hamburger-menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav class="main-nav">
            <div class="nav-wrapper">
                <ul>
                    <li><a href="#">Coffee</a></li>
                    <li><a href="#">Menu</a></li>
                    <li><a href="#">About</a></li>
                </ul>
                <div class="nav-footer">
                    <ul class="social-links">
                        <li><a href="#">FB</a></li>
                        <li><a href="#">IN</a></li>
                        <li><a href="#">TW</a></li>
                    </ul>
                    <p class="copyright">&copy; 2025 Energy Store</p>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="carousel next">
            <div class="list">

            </div>
            <div class="arrows">
                <button id="prev">
                    << /button>
                        <button id="next">></button>
            </div>
        </section>

    <script src="app.js"></script>
</body>

</html>
